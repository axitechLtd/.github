version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions-non-breaking:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      github-actions-breaking:
        patterns:
          - '*'
        update-types:
          - major
